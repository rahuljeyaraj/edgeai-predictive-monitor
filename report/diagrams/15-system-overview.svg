<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1150" viewBox="0 0 1580 1150"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1580" height="1150" fill="#FFFFFF"/><rect x="34.0" y="190.0" width="1074.0" height="196.0" rx="13" fill="#F4F6F8" fill-opacity="0.30" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="49.0" y="179.0" width="550.1" height="22" rx="6" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="1.2"/><text x="324.0" y="194.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Tier 1 — Satellite node  ·  ESP32-S3 (PlatformIO / Arduino)</text><rect x="60.0" y="232.0" width="300.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="210.0" y="260.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Sampler tasks</text><text x="210.0" y="282.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">accel_sampler_task.cpp</text><text x="210.0" y="301.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">mic_sampler_task.cpp</text><text x="210.0" y="320.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">SPI (KX134) / I²S read,</text><text x="210.0" y="340.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">per-axis FFT</text><rect x="420.0" y="232.0" width="300.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="570.0" y="270.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">fuser_task.cpp</text><text x="570.0" y="291.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pool to 128 bins/channel,</text><text x="570.0" y="311.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">6 scalars per channel,</text><text x="570.0" y="330.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">encode via spectrum_codec.cpp</text><rect x="780.0" y="232.0" width="300.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="930.0" y="280.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">transport_task.cpp</text><text x="930.0" y="301.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">MQTT publish over Wi-Fi,</text><text x="930.0" y="320.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">topic  epm/&lt;node_id&gt;/data</text><path d="M360.0,296.0 L420.0,296.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M720.0,296.0 L780.0,296.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="34.0" y="440.0" width="1074.0" height="196.0" rx="13" fill="#F4F6F8" fill-opacity="0.30" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="49.0" y="429.0" width="586.8" height="22" rx="6" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="1.2"/><text x="342.4" y="444.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Tier 2 — Base station MCU  ·  STM32U585 (Zephyr, via App Lab)</text><rect x="60.0" y="482.0" width="300.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="210.0" y="510.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Sampler threads</text><text x="210.0" y="532.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">accel_sampler.cpp/.h</text><text x="210.0" y="551.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">mic_sampler.cpp/.h</text><text x="210.0" y="570.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">KX134 over SPI (FIFO),</text><text x="210.0" y="590.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">INMP441 over SAI</text><rect x="420.0" y="482.0" width="300.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="570.0" y="520.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">fuser.cpp/.h</text><text x="570.0" y="541.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">FFT, statistics, pooling,</text><text x="570.0" y="561.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">frame assembly —</text><text x="570.0" y="580.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">same layout as Tier 1</text><rect x="780.0" y="482.0" width="300.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="930.0" y="530.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">spi_link.cpp/.h</text><text x="930.0" y="551.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">bulk telemetry link</text><text x="930.0" y="570.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">to the Linux side</text><path d="M360.0,546.0 L420.0,546.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M720.0,546.0 L780.0,546.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1188.0" y="318.0" width="358.0" height="190.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1367.0" y="377.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Tier 3 — Base station MPU</text><text x="1367.0" y="399.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">QRB2210  ·  Debian  ·  Python</text><text x="1367.0" y="418.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="1367.0" y="437.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">MQTT subscriber + SPI reader,</text><text x="1367.0" y="457.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline, protection, dashboard</text><rect x="1451.2" y="325.0" width="86.8" height="22.1" rx="11.1" fill="#1B5FA8" opacity="0.92"/><text x="1494.6" y="339.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.00" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">next figure</text><path d="M1080.0,296.0 L1140.0,296.0 L1140.0,380.0 L1188.0,380.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1147.0" y="326.4" width="98.1" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="1153.0" y="343.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">MQTT / Wi-Fi</text><path d="M1080.0,546.0 L1140.0,546.0 L1140.0,452.0 L1188.0,452.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1147.0" y="487.4" width="32.5" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="1153.0" y="504.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">SPI</text><line x1="34.0" y1="690.0" x2="1546.0" y2="690.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="722.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Cross-cutting — the wire format is generated, not hand-synced</text><rect x="34.0" y="760.0" width="1512.0" height="250.0" rx="13" fill="#FBFCFD" fill-opacity="0.30" stroke="#AAB6C2" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="49.0" y="749.0" width="405.9" height="22" rx="6" fill="#FFFFFF" stroke="#AAB6C2" stroke-width="1.2"/><text x="252.0" y="764.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Build-time code generation  ·  run by hand</text><rect x="60.0" y="812.0" width="280.0" height="146.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="200.0" y="858.7" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.90" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">telemetry_schema.json</text><text x="200.0" y="878.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">base-station/</text><text x="200.0" y="898.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">single source of truth</text><text x="200.0" y="917.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">for the wire format</text><rect x="400.0" y="812.0" width="380.0" height="146.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="590.0" y="848.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">gen_telemetry_schema.py</text><text x="590.0" y="868.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">base-station/python/tools/</text><text x="590.0" y="888.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="590.0" y="907.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">no build hook — no PlatformIO</text><text x="590.0" y="927.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">extra_script, no Makefile, no CI</text><path d="M340.0,885.0 L400.0,885.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="840.0" y="781.0" width="340.0" height="64.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="1010.0" y="806.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">sketch/telemetry_schema.h</text><text x="1010.0" y="825.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Tier 2 — STM32U585</text><rect x="840.0" y="853.0" width="340.0" height="64.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="1010.0" y="878.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">frame_codec/telemetry_schema.h</text><text x="1010.0" y="897.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Tier 1 — ESP32-S3</text><rect x="840.0" y="925.0" width="340.0" height="64.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="1010.0" y="950.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">common/telemetry_schema.py</text><text x="1010.0" y="969.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Tier 3 — Python</text><path d="M780.0,885.0 L808.0,885.0 L808.0,813.0 L840.0,813.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><path d="M780.0,885.0 L808.0,885.0 L808.0,957.0 L840.0,957.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><path d="M780.0,885.0 L840.0,885.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><text x="1373.0" y="812.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Every generated file carries</text><text x="1373.0" y="831.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the same first line:</text><rect x="1216.0" y="848.0" width="256.8" height="23" rx="11.5" fill="#FDF0D6" stroke="#A97105" stroke-width="1.2"/><text x="1344.4" y="863.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="bold" font-style="normal" text-anchor="middle" fill="#845804">GENERATED — DO NOT EDIT BY HAND</text><text x="1373.0" y="912.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Re-running the generator against main</text><text x="1373.0" y="931.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">produces zero diff — all three</text><text x="1373.0" y="950.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">checked-in files are in sync.</text><line x1="34.0" y1="90.0" x2="1546.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><rect x="34.0" y="100.0" width="15" height="14" rx="3.5" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.3"/><text x="56.0" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Senses</text><rect x="133.9" y="100.0" width="15" height="14" rx="3.5" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.3"/><text x="155.9" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Decides</text><rect x="238.9" y="100.0" width="15" height="14" rx="3.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.3"/><text x="260.9" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Build-time only — not a runtime stage</text><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Code structure, tier by tier</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Two firmware tiers produce the same self-describing telemetry frame; the Linux tier consumes both. Each block names the file that does the work.</text><line x1="34.0" y1="1069.0" x2="1546.0" y2="1069.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="1093.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Both firmware tiers emit an identical frame layout — 128 spectrum bins per channel for mic and accel x/y/z, plus six scalar statistics per channel: 4 x 128 + 4 x 6 = 536 numbers.</text><text x="34.0" y="1114.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The generator emits ID constants only (channel ids, scalar ids, name-to-id maps). The encode/decode logic on each of the three sides is hand-written against those constants.</text></svg>