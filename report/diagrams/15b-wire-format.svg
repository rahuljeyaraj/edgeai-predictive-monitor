<svg xmlns="http://www.w3.org/2000/svg" width="900" height="832" viewBox="0 0 900 832"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="900" height="832" fill="#FFFFFF"/><rect x="190.0" y="150.0" width="520.0" height="100.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="193.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">telemetry_schema.json</text><text x="450.0" y="215.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the single source of truth</text><rect x="190.0" y="310.0" width="520.0" height="130.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="357.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">gen_telemetry_schema.py</text><text x="450.0" y="379.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">base-station/python/tools/</text><text x="450.0" y="400.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">run by hand — no build hook</text><rect x="150.0" y="500.0" width="600.0" height="170.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="546.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Three generated files</text><text x="450.0" y="568.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">sketch/telemetry_schema.h — MCU</text><text x="450.0" y="589.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">frame_codec/telemetry_schema.h — ESP32</text><text x="450.0" y="610.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">common/telemetry_schema.py — Python</text><text x="450.0" y="632.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">each headed GENERATED — DO NOT EDIT</text><path d="M450.0,250.0 L450.0,310.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M450.0,440.0 L450.0,500.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="34.0" y1="90.0" x2="866.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">One schema, three generated files</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The wire format is generated, not kept in sync by hand.</text><line x1="34.0" y1="709.0" x2="866.0" y2="709.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="733.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">It generates ID constants only — channel ids, scalar ids, name-to-id maps. The encode/decode</text><text x="34.0" y="754.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">logic on each side is hand-written against them.</text><text x="34.0" y="775.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Run by hand after editing the JSON: there is no build hook. Re-running it against main produces no</text><text x="34.0" y="796.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">diff — all three files are in sync.</text></svg>