<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="583" viewBox="0 0 1320 583"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1320" height="583" fill="#FFFFFF"/><rect x="34.0" y="196.0" width="220.0" height="96.0" rx="9" fill="#FDF0D6" stroke="#A97105" stroke-width="1.5" filter="url(#softshadow)"/><text x="144.0" y="228.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#845804">1 · Fault confirmed</text><text x="144.0" y="249.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the score stays over the</text><text x="144.0" y="268.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">fault line, not just one frame</text><rect x="290.0" y="196.0" width="200.0" height="96.0" rx="9" fill="#FDF0D6" stroke="#A97105" stroke-width="1.5" filter="url(#softshadow)"/><text x="390.0" y="228.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#845804">2 · Countdown</text><text x="390.0" y="249.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">10 s, visible on the</text><text x="390.0" y="268.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">dashboard · Hold cancels</text><rect x="526.0" y="196.0" width="210.0" height="96.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="631.0" y="228.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">3 · Trip published</text><text x="631.0" y="249.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">MQTT, naming exactly</text><text x="631.0" y="268.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">which motor — only that one</text><rect x="772.0" y="196.0" width="200.0" height="96.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="872.0" y="228.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">4 · Motor stopped</text><text x="872.0" y="249.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the rig's listener halts</text><text x="872.0" y="268.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">that axis and latches it</text><path d="M254.0,244.0 L290.0,244.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M490.0,244.0 L526.0,244.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M736.0,244.0 L772.0,244.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1060.0" y="150.0" width="226.0" height="84.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="1173.0" y="176.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">5a · Tripped</text><text x="1173.0" y="197.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the vibration gate</text><text x="1173.0" y="216.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">confirms it went quiet</text><rect x="1060.0" y="282.0" width="226.0" height="84.0" rx="9" fill="#FDF0D6" stroke="#A97105" stroke-width="1.5" filter="url(#softshadow)"/><text x="1173.0" y="308.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#845804">5b · Trip failed</text><text x="1173.0" y="329.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">still turning — status</text><text x="1173.0" y="348.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">stays Fault, and says so</text><path d="M972.0,244.0 L1016.0,244.0 L1016.0,192.0 L1060.0,192.0" fill="none" stroke="#B03225" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowAct)"/><path d="M972.0,244.0 L1016.0,244.0 L1016.0,324.0 L1060.0,324.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><text x="390.0" y="320.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="italic" text-anchor="middle" fill="#4A5A6A">operator's only chance to intervene</text><text x="849.0" y="320.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="italic" text-anchor="middle" fill="#4A5A6A">no human in this step</text><line x1="34.0" y1="90.0" x2="1286.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">The trip chain — what actually happens between a bad reading and a stopped motor</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Five boring, checkable steps. Boring is the point: this is the only path in the system allowed to touch the physical world.</text><line x1="34.0" y1="418.0" x2="1286.0" y2="418.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="442.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The delay is deliberate. A protection trip with no delay is a nuisance trip — one transient and the shop stops. Real protection relays use 1–3 s; ten</text><text x="34.0" y="463.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">makes the decision legible on screen.</text><text x="34.0" y="484.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">A trip that was published but never confirmed is NOT reported as tripped. Showing “stopped” for a machine that is still turning would be the most</text><text x="34.0" y="505.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">dangerous lie this system could tell.</text><text x="34.0" y="526.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Latched means latched: that motor refuses every later speed command, including from its own control panel, until a person clears it from the</text><text x="34.0" y="547.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">dashboard.</text></svg>