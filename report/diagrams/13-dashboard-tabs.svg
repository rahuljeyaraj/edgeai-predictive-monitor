<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="641" viewBox="0 0 1340 641"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1340" height="641" fill="#FFFFFF"/><rect x="34.0" y="150.0" width="1272.0" height="52.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="670.0" y="182.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">Trip banner — countdown · Hold · “trip failed” · “tripped at 14:22”</text><rect x="34.0" y="232.0" width="244.0" height="46.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="156.0" y="261.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Fleet</text><text x="156.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Is anything wrong right now?</text><rect x="34.0" y="316.0" width="244.0" height="176.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="156.0" y="356.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="1.30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887"></text><text x="156.0" y="370.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">status tiles that are also filters</text><text x="156.0" y="388.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one row per machine</text><text x="156.0" y="406.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">expand for score, spectra,</text><text x="156.0" y="424.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">classifier, waterfall</text><text x="156.0" y="442.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">guided setup lives here</text><path d="M156.0,202.0 L156.0,232.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="290.0" y="232.0" width="244.0" height="46.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="412.0" y="261.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Classifier</text><text x="412.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">What kind of fault is it?</text><rect x="290.0" y="316.0" width="244.0" height="176.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="412.0" y="356.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="1.30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887"></text><text x="412.0" y="370.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one card per asset class</text><text x="412.0" y="388.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">recordings table + select-driven</text><text x="412.0" y="406.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">upload / relabel / delete</text><text x="412.0" y="424.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">link to Edge Impulse</text><text x="412.0" y="442.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">fetch the trained model</text><path d="M412.0,202.0 L412.0,232.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="546.0" y="232.0" width="244.0" height="46.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="668.0" y="261.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Network</text><text x="668.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Which network is the base station on?</text><rect x="546.0" y="316.0" width="244.0" height="176.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="668.0" y="356.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="1.30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887"></text><text x="668.0" y="370.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">mode, SSID, address</text><text x="668.0" y="388.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">scan and join a network</text><text x="668.0" y="406.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the page a phone lands on</text><text x="668.0" y="424.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">when it joins the onboarding</text><text x="668.0" y="442.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">hotspot</text><path d="M668.0,202.0 L668.0,232.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="802.0" y="232.0" width="244.0" height="46.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="924.0" y="261.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Performance</text><text x="924.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Is the monitor itself keeping up?</text><rect x="802.0" y="316.0" width="244.0" height="176.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="924.0" y="356.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="1.30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887"></text><text x="924.0" y="370.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one chart per CPU core</text><text x="924.0" y="388.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">memory, temperature, GPU</text><text x="924.0" y="406.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">per-pipeline frames/s</text><text x="924.0" y="424.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and time-budget used</text><text x="924.0" y="442.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">no fabricated headroom number</text><path d="M924.0,202.0 L924.0,232.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1058.0" y="232.0" width="244.0" height="46.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="1180.0" y="261.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">Alerts</text><text x="1180.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Who gets told, and about what?</text><rect x="1058.0" y="316.0" width="244.0" height="176.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="1180.0" y="365.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="1.30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887"></text><text x="1180.0" y="379.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Telegram connection + QR code</text><text x="1180.0" y="397.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one row per subscriber</text><text x="1180.0" y="415.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">alert level per subscriber</text><text x="1180.0" y="433.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">whole fleet or named machines</text><path d="M1180.0,202.0 L1180.0,232.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="34.0" y="534.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="italic" text-anchor="start" fill="#4A5A6A">Nothing is shown twice. The asset class is editable in setup and nowhere else; the trip output is configured in setup and only read back on the tile.</text><line x1="34.0" y1="90.0" x2="1306.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Five tabs, five questions</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Each tab answers one question completely, and no fact is editable in two of them.</text><line x1="34.0" y1="539.0" x2="1306.0" y2="539.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="563.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">The trip banner sits above the tabs, not inside one, so a countdown and its Hold button are on screen no matter which tab is open. Ten seconds is not</text><text x="34.0" y="584.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">enough time to go looking.</text><text x="34.0" y="605.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Every tab is one self-contained JavaScript module with its own data, sharing exactly one WebSocket. No framework, no build step, no bundler.</text></svg>