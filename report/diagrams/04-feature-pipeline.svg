<text x="610.0" y="185.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F5FA8">Autoencoder</text><text x="610.0" y="202.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">compress -&gt; rebuild</text><text x="610.0" y="219.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">(trained on healthy</text><text x="610.0" y="235.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">data only)</text><rect x="760" y="150" width="200" height="110" rx="10" fill="#DCEAFB" stroke="#1F5FA8" stroke-width="1.6"/><text x="860.0" y="191.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F5FA8">Anomaly Score</text><text x="860.0" y="208.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">input vs.</text><text x="860.0" y="225.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">reconstruction gap</text><rect x="1000" y="30" width="160" height="65" rx="10" fill="#E8F5EA" stroke="#2E7D46" stroke-width="1.6"/><text x="1080.0" y="66.98" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2E7D46">Healthy</text><rect x="1000" y="197" width="160" height="65" rx="10" fill="#FDF1DA" stroke="#B8790B" stroke-width="1.6"/><text x="1080.0" y="233.98" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="nor