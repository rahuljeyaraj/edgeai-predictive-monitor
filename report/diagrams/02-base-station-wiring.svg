font-style="normal" text-anchor="start" fill="#4A5A6A">Two internal links, on purpose: small control messages on the UART, bulk spectra on the SPI, so a large diagnostic pull can never stall the live status loop.</text><text x="34.0" y="728.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Exact nets, net names and header pins: the KiCad schematic in Appendix B.</text></svg>