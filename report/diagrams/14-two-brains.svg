>Zephyr RTOS · 2 MB flash · 786 kB SRAM</text><rect x="72" y="164" width="488" height="66" rx="8" fill="#FFFFFF" stroke="#3D5266" stroke-width="1.3"/><text x="316.0" y="191.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Samples both sensors</text><text x="316.0" y="212.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">KX134 at 12.8 kHz and INMP441, never missing a window</text><rect x="72" y="244" width="488" height="66" rx="8" fill="#FFFFFF" stroke="#3D5266" stroke-width="1.3"/><text x="316.0" y="271.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Reduces the firehose</text><text x="316.0" y="292.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">512-point FFT and six statistics, per channel</text><rect x="72" y="324" width="488" height="66" rx="8" fill="#FFFFFF" stroke="#3D5266" stroke-width="1.3"/><text x="316.0" y="351.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Drives the lights</text><text x="316.0" y="372.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the status ring, and the board's own 8×13 LED matrix</text><rect x="764" y="86" width="520" height="322" rx="14" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="2" filter="url(#softshadow)"/><text x="1024.0" y="120.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">QRB2210 · 4 × Cortex-A53 @ 2.0 GHz</text><text x="1024.0" y="143.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Debian Linux · 4 GB LPDDR4X · Wi-Fi 5</text><rect x="780" y="164" width="488" height="66" rx="8" fill="#FFFFFF" stroke="#1B5FA8" stroke-width="1.3"/><text x="1024.0" y="191.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Trains a model per machine</text><text x="1024.0" y="212.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">PyTorch on the board, in seconds, with no cloud</text><rect x="780" y="244" width="488" height="66" rx="8" fill="#FFFFFF" stroke="#1B5FA8" stroke-width="1.3"/><text x="1024.0" y="271.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Scores and decides</text><text x="1024.0" y="292.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">anomaly model, running gate, classifier, the trip</text><rect x="780" y="324" width="488" height="66" rx="8" fill="#FFFFFF" stroke="#1B5FA8" stroke-width="1.3"/><text x="1024.0" y="351.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Is the server</text><text x="1024.0" y="372.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">dashboard, MQTT broker, asset registry, Telegram</text><path d="M582.0,197.0 L758.0,197.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url