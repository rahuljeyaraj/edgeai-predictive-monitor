<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="830" viewBox="0 0 1340 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1340" height="830" fill="#FFFFFF"/><rect x="34.0" y="150.0" width="180.0" height="64.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="124.0" y="187.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">New</text><rect x="300.0" y="150.0" width="190.0" height="64.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="395.0" y="187.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Collecting</text><rect x="580.0" y="150.0" width="180.0" height="64.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="670.0" y="187.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Training</text><path d="M214.0,182.0 L300.0,182.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="221.7" y="158.0" width="70.6" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="257.0" y="171.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">Commission</text><path d="M490.0,182.0 L580.0,182.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="499.6" y="158.0" width="70.7" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="535.0" y="171.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">Stop &amp; train</text><rect x="470.0" y="280.0" width="380.0" height="300.0" rx="13" fill="#DCEAFB" fill-opacity="0.30" stroke="#1B5FA8" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="485.0" y="269.0" width="244.3" height="22" rx="6" fill="#FFFFFF" stroke="#1B5FA8" stroke-width="1.2"/><text x="607.2" y="284.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Live — re-scored on every frame</text><rect x="500.0" y="322.0" width="320.0" height="62.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="660.0" y="358.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">Healthy</text><rect x="500.0" y="404.0" width="320.0" height="62.0" rx="9" fill="#FDF0D6" stroke="#A97105" stroke-width="1.5" filter="url(#softshadow)"/><text x="660.0" y="440.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#845804">Warning</text><rect x="500.0" y="486.0" width="320.0" height="62.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="660.0" y="522.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">Fault</text><path d="M670.0,214.0 L800.0,214.0 L800.0,280.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="807.0" y="237.0" width="100.1" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="813.0" y="250.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">first model saved</text><path d="M500.0,353.0 L420.0,353.0 L420.0,238.0 L395.0,238.0 L395.0,214.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="330.4" y="265.5" width="82.6" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="407.0" y="279.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="end" fill="#16202B">Recommission</text><rect x="930.0" y="322.0" width="200.0" height="62.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="1030.0" y="358.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Idle</text><rect x="930.0" y="486.0" width="200.0" height="62.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="1030.0" y="522.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">Tripped</text><rect x="930.0" y="640.0" width="200.0" height="62.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="1030.0" y="676.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Offline</text><rect x="500.0" y="640.0" width="320.0" height="62.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="660.0" y="676.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Paused</text><path d="M820.0,353.0 L930.0,353.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="822.0" y="299.5" width="106.0" height="19.5" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="875.0" y="312.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">a person stopped it</text><path d="M820.0,517.0 L930.0,517.0" fill="none" stroke="#B03225" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowAct)"/><rect x="836.3" y="463.5" width="77.4" height="19.5" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="875.0" y="476.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#B03225">we stopped it</text><path d="M660.0,580.0 L660.0,640.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="667.0" y="600.0" width="93.1" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="673.0" y="613.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">Pause / Resume</text><path d="M850.0,580.0 L884.0,580.0 L884.0,671.0 L930.0,671.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#arrowSoft)"/><rect x="891.0" y="615.8" width="64.4" height="19.5" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="897.0" y="629.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">silent 30 s</text><rect x="34.0" y="300.0" width="384.0" height="262.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="226.0" y="371.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Reading this diagram</text><text x="226.0" y="389.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Blue group — the three statuses the anomaly</text><text x="226.0" y="405.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">model is allowed to confirm by itself.</text><text x="226.0" y="420.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="226.0" y="436.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Grey boxes — set by a person, or derived from</text><text x="226.0" y="451.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">silence. Never chosen by a model.</text><text x="226.0" y="467.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="226.0" y="482.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Red edge — the one transition in the entire</text><text x="226.0" y="498.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">system that moves something physical.</text><line x1="34.0" y1="90.0" x2="1306.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Every status an asset can be in</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Ten states. The only things that move between them are a measurement or a deliberate human action.</text><line x1="34.0" y1="728.0" x2="1306.0" y2="728.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="752.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Idle and Tripped both mean the machine is not turning. They differ only in who stopped it — which is exactly the distinction an operator needs, and which one “stopped” status would erase.</text><text x="34.0" y="773.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">There is no “reset protection” button, by design. Restart the machine and it is scored from scratch: fix the fault and it returns to Healthy; don't, and it trips again.</text><text x="34.0" y="794.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Offline is never stored. It is derived from how long ago the last frame arrived, so it can never get stuck on after a node comes back.</text></svg>