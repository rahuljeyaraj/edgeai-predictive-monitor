fill="#4A5A6A">Tells a human</text><rect x="340.1" y="100.0" width="15" height="14" rx="3.5" fill="#FBE1DE" stroke="#B03225" stroke-width="1.3"/><text x="362.1" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Acts (physical)</text><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">EdgeAI Predictive Monitor — the whole loop, one picture</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Every sensing point reports to one base station; the base station is the only thing that decides.</text><line x1="34.0" y1="579.0" x2="1146.0" y2="579.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="603.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Sensing → deciding → acting closes without a human in it. Everything left of the base station is a sense organ; everything right of it is an output.</text><text x="34.0" y="624.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">The STOP arrow is the one that makes this Physical AI rather than a very well-instrumented dashboard.</text></svg>