; PlatformIO project for the ESP32S3 (Seeed XIAO ESP32S3) satellite nodes.
;
; Mirrors mcu/ (the Zephyr firmware for the UNO Q's onboard STM32U585) in
; every functional respect - same KX134 accelerometer, same I2S MEMS mic,
; same WS2812 status ring, same accel/mic FFT + fuse pipeline - except the
; transport: mcu/ talks LPUART1 wire_protocol frames to the MPU over a
; point-to-point wired link (docs/Appendix_B_Wire_Protocol_Specification.md
; S2), this node talks WiFi/MQTT (S3) to the same MPU, since it isn't
; physically attached to the UNO Q the way the onboard MCU is.
;
; Arduino framework (not ESP-IDF) chosen deliberately over mirroring mcu/'s
; low-level Zephyr driver style: WiFi/MQTT/I2S/SPI setup is dramatically
; simpler here, arduino-esp32 is first-class for this board, and the FFT/
; MQTT/NeoPixel libraries below are all mature Arduino ecosystem libraries
; rather than requiring ESP-IDF component integration.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; USB CDC on boot: XIAO ESP32S3 uses native USB (no separate USB-serial
; bridge chip) - this is required for Serial (LOG output) to appear over
; the same USB port used for flashing, mirroring mcu/'s USART1 debug log
; being always-on / independent of the MCU<->MPU link. (The board def
; already sets this via extra_flags; repeated here so it's visible without
; having to know that.)
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall
	-Wextra

monitor_speed = 115200
; The actual MCU<->MPU-equivalent link on this node is WiFi/MQTT, not this
; serial port - this port is debug-log-only, same role as mcu/'s USART1
; console.
monitor_filters = esp32_exception_decoder

lib_deps =
	; MQTT client - mirrors hal_transport.h's role, but pub/sub instead of
	; a framed UART byte stream (MQTT already provides message framing).
	; Buffer size bumped at runtime via setBufferSize()
	; (threads/transport_task.cpp) past the 256B compile-time default -
	; our binary telemetry frame runs a few KB. No JSON library needed:
	; the MQTT data-topic payload is the same generic section-list frame
	; the base station's SPI link sends (frame_codec/spectrum_codec.h),
	; byte-identical to base-station/python/common/telemetry_frame.py's
	; codec - an earlier revision of this firmware used
	; bblanchon/ArduinoJson@^7.4 for a JSON envelope this wire format has
	; since replaced outright.
	knolleary/PubSubClient@^2.8
	; WS2812 ring driver - the Arduino-ecosystem equivalent of mcu/'s
	; zephyr,worldsemi,ws2812-spi led_strip driver (drivers/rgb_ws2812.c).
	adafruit/Adafruit NeoPixel@^1.12
	; Real-valued FFT, the ESP32/Arduino-ecosystem equivalent of CMSIS-DSP's
	; arm_rfft_fast_f32() used by mcu/'s accel/mic sampler threads. GPL-3.0
	; licensed (unlike the rest of this port's MIT-licensed dependencies) -
	; noted here since it differs from mcu/'s CMSIS-DSP (Apache-2.0); swap
	; if a stricter license posture is ever needed for this satellite
	; firmware specifically.
	kosme/arduinoFFT@^2.0.4
