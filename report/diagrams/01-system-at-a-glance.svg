l="#4A5A6A">stopped on a confirmed fault,</text><text x="990.0" y="502.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">stays refused until cleared by hand</text><path d="M292.0,214.0 L346.0,214.0 L346.0,226.0 L400.0,226.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="277.7" y="204.0" width="82.7" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="319.0" y="217.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">sensor frames</text><path d="M292.0,348.0 L346.0,348.0 L346.0,340.0 L400.0,340.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="279.9" y="338.0" width="78.2" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="319.0" y="351.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">Wi-Fi / MQTT</text><path d="M700.0,216.0 L768.0,216.0 L768.0,183.0 L834.0,183.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="688.5" y="206.0" width="90.9" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="734.0" y="219.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">status + scores</text><path d="M700.0,269.0 L834.0,269.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="725.7" y="259.0" width="82.7" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="767.0" y="272.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"