ight="36" rx="6" fill="#FFFFFF" stroke="#D6DEE6" stroke-width="1.1"/><text x="76.0" y="748.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">▸  Scalar values</text><rect x="313.3" y="726" width="237.3" height="36" rx="6" fill="#FFFFFF" stroke="#D6DEE6" stroke-width="1.1"/><text x="325.3" y="748.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">▸  Raw signals</text><rect x="562.7" y="726" width="237.3" height="36" rx="6" fill="#FFFFFF" stroke="#D6DEE6" stroke-width="1.1"/><text x="574.7" y="748.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">▸  Waterfall</text><rect x="872.0" y="128.0" width="334.0" height="74.0" rx="7" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1039.0" y="151.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Five tabs, one page</text><text x="1039.0" y="169.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Fleet · Classifier · Network ·</text><text x="1039.0" y="184.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Performance · Alerts</text><path d="M830.0,165.0 L872.0,165.0" fill="none" stroke="#8C9AA8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="872.0" y="227.0" width="334.0" height="96.0" rx="7" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1039.0" y="254.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Counts that are also filters</text><text x="1039.0" y="272.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Every tile is a toggle. Empty</text><text x="1039.0" y="287.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">buckets hide themselves, so the</text><text x="1039.0" y="302.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">row never fills with zeroes.</text><path d="M830.0,275.0 L872.0,275.0" fill="none" stroke="#8C9AA8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="872.0" y="342.0" width="334.0" height="96.0" rx="7" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1039.0" y="369.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">One row per machine</text><text x="1039.0" y="387.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Nickname, node ID, asset class,</text><text x="1039.0" y="402.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">status — and the classifier's</text><text x="1039.0" y="417.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">read when there is a fault.</text><path d="M830.0,390.0 L872.0,390.0" fill="none" stroke="#8C9AA8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="872.0" y="494.0" width="334.0" height="152.0" rx="7" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1039.0" y="534.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Open a row for everything else</text><text x="1039.0" y="552.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Protection controls first (the only</text><text x="1039.0" y="567.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">time-critical thing on screen),</text><text x="1039.0" y="582.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">then the anomaly trend, the fault</text><text x="1039.0" y="597.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">classification, live spectra, and</text><text x="1039.0" y="612.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">three collapsed deep-dive panels.</text><path d="M830.0,570.0 L872.0,570.0" fill="none" stroke="#8C9AA8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="872.0" y="682.0" width="334.0" height="96.0" rx="7" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1039.0" y="709.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Charts survive the list</text><text x="1039.0" y="727.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Plotly elements are re-parented,</text><text x="1039.0" y="742.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">never rebuilt — a zoom you set</text><text x="1039.0" y="757.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">outlives every live update.</text><path d="M830.0,730.0 L872.0,730.0" fill="none" stroke="#8C9AA8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><line x1="34.0" y1="90.0" x2="1206.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Anatomy of the Fleet page</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">One page, five tabs, and a row that opens into everything known about one machine.</text><line x1="34.0" y1="820.0" x2="1206.0" y2="820.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="844.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Nothing on this page polls for a chart. One WebSocket carries spectra, scores, classifier results, training progress and status changes to every open browser.</text></svg>