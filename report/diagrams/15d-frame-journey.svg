<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1143" viewBox="0 0 900 1143"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="900" height="1143" fill="#FFFFFF"/><rect x="230.0" y="170.0" width="440.0" height="90.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="197.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">A frame arrives for one machine</text><text x="450.0" y="219.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline/manager.py sends it to</text><text x="450.0" y="240.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">that machine's own pipeline</text><rect x="230.0" y="286.0" width="440.0" height="85.0" rx="26" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="335.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Is the machine paused?</text><rect x="40.0" y="299.0" width="110.0" height="58.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="95.0" y="334.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">stop</text><path d="M230.0,328.0 L150.0,328.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="172.3" y="300.7" width="35.4" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="190.0" y="317.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">yes</text><path d="M450.0,371.0 L450.0,390.0 L234.0,390.0 L234.0,410.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M450.0,371.0 L450.0,390.0 L666.0,390.0 L666.0,410.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="34.0" y="410.0" width="400.0" height="250.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="234.0" y="464.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Name the likely fault</text><text x="234.0" y="486.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline/classifier.py</text><text x="234.0" y="507.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="234.0" y="528.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">needs a fault model for this</text><text x="234.0" y="550.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">machine's type — one model</text><text x="234.0" y="571.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">covers every machine of that type</text><text x="234.0" y="593.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="234.0" y="614.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and the machine must be running</text><rect x="466.0" y="410.0" width="400.0" height="250.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="666.0" y="464.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Score how unusual it looks</text><text x="666.0" y="486.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline/inference.py</text><text x="666.0" y="507.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="666.0" y="528.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">needs this machine's own model,</text><text x="666.0" y="550.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">fitted when it was commissioned</text><text x="666.0" y="571.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="666.0" y="593.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and the machine must be running —</text><text x="666.0" y="614.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">tested separately from the left</text><rect x="64.0" y="700.0" width="340.0" height="80.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="234.0" y="722.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">a fault name</text><text x="234.0" y="744.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">shown on the dashboard,</text><text x="234.0" y="765.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">never trips the machine</text><rect x="496.0" y="700.0" width="340.0" height="80.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="666.0" y="733.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">healthy · warning · fault</text><text x="666.0" y="755.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">against its own thresholds</text><path d="M234.0,660.0 L234.0,700.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M666.0,660.0 L666.0,700.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="230.0" y="830.0" width="440.0" height="90.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="868.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">Publish the result</text><text x="450.0" y="890.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">registry · history · dashboard</text><path d="M234.0,780.0 L234.0,800.0 L450.0,800.0 L450.0,830.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M666.0,780.0 L666.0,800.0 L450.0,800.0 L450.0,830.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="34.0" y1="90.0" x2="866.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">What happens to one frame</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">One machine at a time. Two models run in the same thread, under two different conditions.</text><line x1="34.0" y1="999.0" x2="866.0" y2="999.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="1023.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Two models, trained two different ways. The fault classifier is trained once per machine type in</text><text x="34.0" y="1044.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Edge Impulse and shared by every machine of that type. The health model is trained on the board,</text><text x="34.0" y="1065.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">from one machine's own healthy data.</text><text x="34.0" y="1086.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Either side can be missing. No fault model for the type means no fault name; a machine that was</text><text x="34.0" y="1107.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">never commissioned gets no score. Neither blocks the other.</text></svg>