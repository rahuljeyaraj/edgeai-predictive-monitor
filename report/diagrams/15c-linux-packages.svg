35.1" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">pipeline/</text><text x="269.0" y="356.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one instance per machine</text><text x="269.0" y="378.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">scoring · commissioning · capture · baseline</text><text x="269.0" y="399.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">every frame goes to all four</text><rect x="34.0" y="446.0" width="470.0" height="110.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="269.0" y="483.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">registry/</text><text x="269.0" y="505.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">what each machine is,</text><text x="269.0" y="526.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and the status it is in now</text><rect x="34.0" y="584.0" width="470.0" height="110.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="269.0" y="621.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">api/</text><text x="269.0" y="643.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">FastAPI routes and the WebSocket</text><text x="269.0" y="664.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one controller per flow</text><rect x="34.0" y="722.0" width="470.0" height="110.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="269.0" y="759.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">frontend/</text><text x="269.0" y="781.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the dashboard — app.js</text><text x="269.0" y="802.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and one module per tab</text><path d="M269.0,280.0 L269.0,308.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="276.0" y="282.4" width="55.0" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="282.0" y="299.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">frames</text><path d="M269.0,418.0 L269.0,446.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="276.0" y="420.4" width="106.8" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="282.0" y="437.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="start" fill="#16202B">score + status</text><path d="M269.0,556.0 L269.0,584.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M269.0,694.0 L269.0,722.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="610.0" y="446.0" width="256.0" height="110.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="738.0" y="483.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">protection/</text><text x="738.0" y="505.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the trip decision</text><text x="738.0" y="526.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and the stop output</text><path d="M504.0,501.0 L610.0,501.0" fill="none" stroke="#B03225" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowAct)"/><rect x="535.8" y="473.7" width="42.4" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="557.0" y="490.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#B03225">fault</text><rect x="610.0" y="170.0" width="256.0" height="110.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="738.0" y="207.8" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">main.py</text><text x="738.0" y="229.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">constructs every object</text><text x="738.0" y="250.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">and wires them together</text><rect x="610.0" y="584.0" width="256.0" height="248.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="738.0" y="661.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">used throughout</text><text x="738.0" y="683.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">common/ — the wire format</text><text x="738.0" y="703.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">history/ — score history</text><text x="738.0" y="723.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">alerts/ — Telegram</text><text x="738.0" y="743.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">monitoring/ — performance</text><text x="738.0" y="764.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">network/ — Wi-Fi</text><line x1="34.0" y1="90.0" x2="866.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">The Linux side, package by package</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">A measurement travels down the left. Each box is a directory under base-station/python/.</text><line x1="34.0" y1="900.0" x2="866.0" y2="900.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="924.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">main.py holds no logic of its own. It constructs every object in dependency order and connects</text><text x="34.0" y="945.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">them, so reading it top to bottom is reading the architecture.</text></svg>