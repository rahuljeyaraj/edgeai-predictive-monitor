="normal" text-anchor="middle" fill="#4A5A6A">stopped on a confirmed fault,</text><text x="990.0" y="505.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">stays refused until cleared by hand</text><path d="M292.0,214.0 L400.0,214.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="294.1" y="186.7" width="103.9" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="346.0" y="203.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">sensor frames</text><path d="M292.0,348.0 L400.0,348.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="297.0" y="320.7" width="98.1" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="346.0" y="337.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">Wi-Fi / MQTT</text><path d="M700.0,198.0 L834.0,198.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="709.7" y="170.7" width="114.6" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="767.0" y="187.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">status + scores</text><path d="M700.0,284.0 L834.0,284.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="715.1" y="256.7" width="103.9" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="767.0" y="273.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">fault message</text><path d="M700.0,370.0 L834.0,370.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="715.1" y="342.7" width="103.9" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="767.0" y="359.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">colour + mode</text><path d="M640.0,392.0 L640.0,480.0 L834.0,480.0" fill="none" stroke="#B03225" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowAct)"/><rect x="686.5" y="452.7" width="101.0" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="737.0" y="469.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#B03225">STOP  motor N</text><line x1="34.0" y1="90.0" x2="1146.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><rect x="34.0" y="100.0" width="15" height="14" rx="3.5" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.3"/><text x="56.0" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Senses</text><rect x="133.9" y="100.0" width="15" height="14" rx="3.5" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.3"/><text x="155.9" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Decides</text><rect x="238.9" y="100.0" width="15" height="14" rx="3.5" fill="#E4F3E8" stroke="#237A41" stroke-width="1.3"/><text x="260.9" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Tells a human</text><rect x="386.0" y="100.0" width="15" height="14" rx="3.5" fill="#FBE1DE" stroke="#B03225" stroke-width="1.3"/><text x="408.0" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Acts (physical)</text><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">EdgeAI Predictive Monitor — the whole loop, one picture</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Every sensing point reports to one base station; the base station is the only thing that decides.</text><line x1="34.0" y1="579.0" x2="1146.0" y2="579.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="603.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Sensing → deciding → acting closes without a human in it. Everything left of the base station is a sense organ; everything right of it</text><text x="34.0" y="624.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">is an output.</text><text x="34.0" y="645.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">The STOP arrow is the one that makes this Physical AI rather than a very well-instrumented dashboard.</text></svg>