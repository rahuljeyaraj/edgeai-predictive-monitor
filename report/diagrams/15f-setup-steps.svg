etica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">learn what stopped looks like</text><rect x="250.0" y="326.0" width="400.0" height="70.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="354.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">3 · Machine running</text><text x="450.0" y="375.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">collect healthy data</text><rect x="250.0" y="414.0" width="400.0" height="70.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="442.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">4 · Train</text><text x="450.0" y="463.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">fit the model on the board</text><rect x="250.0" y="502.0" width="400.0" height="70.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="530.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">5 · Stop output</text><text x="450.0" y="551.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">wire the trip — skippable</text><rect x="250.0" y="590.0" width="400.0" height="70.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="618.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">6 · Done</text><text x="450.0" y="639.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">live and scoring</text><path d="M450.0,220.0 L450.0,238.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><path d="M450.0,308.0 L450.0,326.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><path d="M450.0,396.0 L450.0,414.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><path d="M450.0,484.0 L450.0,502.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><path d="M450.0,572.0 L450.0,590.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><text x="450.0" y="700.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">step 5 is the only skippable one  (setup_controller.py:79)</text><line x1="34.0" y1="90.0" x2="866.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">The guided setup</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Six steps, run once per machine. None of this is in the live scoring path.</text><line x1="34.0" y1="720.0" x2="866.0" y2="720.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="744.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">api/setup_controller.py owns the step order only — each step drives a controller that already</text><text x="34.0" y="765.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">existed.</text></svg>