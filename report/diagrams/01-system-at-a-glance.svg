<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475B"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B23A2E"/></marker></defs><rect x="0" y="0" width="1040" height="560" fill="#FFFFFF"/><text x="30" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#33475B">Watches / Notices</text><rect x="140" y="18" width="14" height="14" fill="#EEF2F7" stroke="#33475B"/><text x="170" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#1F5FA8">Decides</text><rect x="240" y="18" width="14" height="14" fill="#DCEAFB" stroke="#1F5FA8"/><text x="260" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a"></text><text x="330" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#B23A2E">Acts</text><rect x="370" y="18" width="14" height="14" fill="#FBE3E1" stroke="#B23A2E"/><text x="400" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a"></text><text x="460" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#2E7D46">Tells a human</text><rect x="580" y="18" width="14" height="14" fill="#E8F5EA" stroke="#2E7D46"/><rect x="30" y="90" width="210" height="80" rx="10" fill="#EEF2F7" stroke="#33475B" stroke-width="1.6"/><text x="135.0" y="116.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#33475B">Sensor Pod</text><text x="135.0" y="133.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">accelerometer + microphone</text><text x="135.0" y="150.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">on the base station</text><rect x="30" y="210" width="210" height="90" rx="10" fill="#EEF2F7" stroke="#33475B" stroke-width="1.6"/><text x="135.0" y="235.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#33475B">Satellite Nodes</text><text x="135.0" y="252.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">accelerometer + microphone</text><text x="135.0" y="269.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">one per extra machine</text><text x="135.0" y="285.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">Wi-Fi</text><rect x="340" y="130" width="260" height="180" rx="10" fill="#DCEAFB" stroke="#1F5FA8" stroke-width="1.6"/><text x="470.0" y="200.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F5FA8">Base Station</text><text x="470.0" y="219.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">registry + AI pipeline</text><text x="470.0" y="235.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">(commissioning, scoring,</text><text x="470.0" y="252.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">gate, trip logic)</text><rect x="720" y="60" width="260" height="70" rx="10" fill="#E8F5EA" stroke="#2E7D46" stroke-width="1.6"/><text x="850.0" y="99.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2E7D46">Live Dashboard</text><rect x="720" y="150" width="260" height="70" rx="10" fill="#E8F5EA" stroke="#2E7D46" stroke-width="1.6"/><text x="850.0" y="189.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2E7D46">Phone Alert (Telegram)</text><rect x="720" y="240" width="260" height="70" rx="10" fill="#E8F5EA" stroke="#2E7D46" stroke-width="1.6"/><text x="850.0" y="279.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2E7D46">Status Ring + LED Matrix</text><rect x="680" y="370" width="340" height="90" rx="10" fill="#FBE3E1" stroke="#B23A2E" stroke-width="1.6"/><text x="850.0" y="401.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B23A2E">Motor Power</text><text x="850.0" y="419.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">cut on confirmed fault</text><text x="850.0" y="435.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">stays off until cleared</text><line x1="240" y1="130" x2="340" y2="190" stroke="#33475B" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="249.05" y="149.0" width="81.89999999999999" height="15" fill="#FFFFFF" opacity="0.92"/><text x="290.0" y="160.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">sensor frames</text><line x1="240" y1="255" x2="340" y2="250" stroke="#33475B" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="252.2" y="241.5" width="75.6" height="15" fill="#FFFFFF" opacity="0.92"/><text x="290.0" y="252.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">Wi-Fi / MQTT</text><line x1="600" y1="180" x2="720" y2="95" stroke="#33475B" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="612.75" y="126.5" width="94.5" height="15" fill="#FFFFFF" opacity="0.92"/><text x="660.0" y="137.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">status + scores</text><line x1="600" y1="210" x2="720" y2="185" stroke="#33475B" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="600" y1="240" x2="720" y2="275" stroke="#33475B" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="600" y1="280" x2="680" y2="400" stroke="#B23A2E" stroke-width="2.4" marker-end="url(#arrowred)"/><rect x="602.2" y="329.0" width="75.6" height="15" fill="#FFFFFF" opacity="0.92"/><text x="640.0" y="340.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222">STOP command</text><line x1="30" y1="480" x2="1010" y2="480" stroke="#cccccc" stroke-width="1"/><text x="30" y="510" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="start" fill="#333333">Sensing -&gt; deciding -&gt; acting, in one loop, with no human required at the moment it matters.</text><text x="30" y="535" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#B23A2E">The STOP command is the one arrow that makes this Physical AI rather than a dashboard.</text></svg>