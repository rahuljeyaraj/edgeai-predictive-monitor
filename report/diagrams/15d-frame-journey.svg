<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1141" viewBox="0 0 900 1141"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="900" height="1141" fill="#FFFFFF"/><rect x="170.0" y="170.0" width="460.0" height="95.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="200.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">A frame arrives</text><text x="400.0" y="222.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline/manager.py routes it to</text><text x="400.0" y="243.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">that machine's own pipeline</text><rect x="170.0" y="291.0" width="460.0" height="95.0" rx="26" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="345.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Is the machine paused?</text><rect x="170.0" y="412.0" width="460.0" height="95.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="442.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Name the likely fault</text><text x="400.0" y="464.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline/classifier.py</text><text x="400.0" y="485.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">only while the machine is running</text><rect x="170.0" y="533.0" width="460.0" height="95.0" rx="26" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="587.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Has this machine been trained?</text><rect x="170.0" y="654.0" width="460.0" height="95.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="684.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Score how unusual it looks</text><text x="400.0" y="706.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pipeline/inference.py</text><text x="400.0" y="727.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">checks running again, separately</text><rect x="170.0" y="775.0" width="460.0" height="95.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="816.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Healthy, warning or fault</text><text x="400.0" y="837.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">against this machine's own thresholds</text><rect x="170.0" y="896.0" width="460.0" height="95.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="400.0" y="937.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">Publish the result</text><text x="400.0" y="958.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">registry · history · dashboard</text><path d="M400.0,265.0 L400.0,291.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M400.0,386.0 L400.0,412.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M400.0,507.0 L400.0,533.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M400.0,628.0 L400.0,654.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M400.0,749.0 L400.0,775.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M400.0,870.0 L400.0,896.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="20.0" y="308.0" width="100.0" height="60.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="70.0" y="344.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">stop</text><path d="M170.0,338.0 L120.0,338.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="127.3" y="310.7" width="35.4" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="145.0" y="327.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">yes</text><rect x="20.0" y="550.0" width="100.0" height="60.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="70.0" y="586.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">stop</text><path d="M170.0,580.0 L120.0,580.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSoft)"/><rect x="131.2" y="552.7" width="27.6" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="145.0" y="569.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">no</text><text x="650.0" y="452.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">runs even if the machine</text><text x="650.0" y="472.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">was never trained</text><text x="650.0" y="694.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">the running test happens</text><text x="650.0" y="714.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">twice, independently</text><text x="70.0" y="400.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">nothing runs</text><text x="70.0" y="642.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">fault name only</text><line x1="34.0" y1="90.0" x2="866.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">What happens to one frame</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Top to bottom, one machine at a time. Two models run, under two different conditions.</text><line x1="34.0" y1="1039.0" x2="866.0" y2="1039.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="1063.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The fault name and the health score come from two separate models. A machine that has never</text><text x="34.0" y="1084.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">been trained still gets a fault name — it just gets no score.</text><text x="34.0" y="1105.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The 'is it running' test is made twice, once for each model. Neither test depends on the other.</text></svg>