<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1340" height="700" fill="#FFFFFF"/><rect x="34.0" y="168.0" width="570.0" height="92.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="319.0" y="208.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">STM32U585 · Cortex-M33 @ 160 MHz</text><text x="319.0" y="228.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Zephyr RTOS · 2 MB flash · 786 kB SRAM</text><rect x="34.0" y="278.0" width="570.0" height="78.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="319.0" y="311.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Sample without missing a window</text><text x="319.0" y="329.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">KX134 over SPI at 12.8 kHz, INMP441 over SAI, both continuous</text><rect x="34.0" y="368.0" width="570.0" height="78.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="319.0" y="401.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Reduce the firehose</text><text x="319.0" y="419.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">512-point FFT per channel, six statistics, average-pooled to 128 wire bins</text><rect x="34.0" y="458.0" width="570.0" height="78.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="319.0" y="491.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Drive the lights</text><text x="319.0" y="509.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">WS2812 ring on a DMA timer channel, and the board's own 8×13 LED matrix</text><rect x="736.0" y="168.0" width="570.0" height="92.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1021.0" y="208.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">QRB2210 · 4 × Cortex-A53 @ 2.0 GHz</text><text x="1021.0" y="228.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Debian Linux · 2 GB LPDDR4X · Wi-Fi 5</text><rect x="736.0" y="278.0" width="570.0" height="78.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1021.0" y="311.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Train a neural network in the field</text><text x="1021.0" y="329.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">PyTorch, on the board, while a technician waits — no cloud, no queue</text><rect x="736.0" y="368.0" width="570.0" height="78.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1021.0" y="401.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Score and decide</text><text x="1021.0" y="419.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">anomaly model, running/stopped gate, TFLite classifier, the trip decision</text><rect x="736.0" y="458.0" width="570.0" height="78.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1021.0" y="491.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Be a server</text><text x="1021.0" y="509.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">dashboard, WebSocket, MQTT broker, asset registry, history, Telegram</text><rect x="628.0" y="300.0" width="84.0" height="236.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="670.0" y="418.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="1" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887"></text><text x="670.0" y="330.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#16202B">LPUART1</text><text x="670.0" y="348.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">500 kbaud</text><text x="670.0" y="366.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">control RPC</text><text x="670.0" y="452.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#16202B">SPI</text><text x="670.0" y="470.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">~40 MHz</text><text x="670.0" y="488.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">bulk telemetry</text><path d="M604.0,320.0 L628.0,320.0" fill="none" stroke="#3D5266" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M712.0,320.0 L736.0,320.0" fill="none" stroke="#3D5266" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M604.0,442.0 L628.0,442.0" fill="none" stroke="#3D5266" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M712.0,442.0 L736.0,442.0" fill="none" stroke="#3D5266" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="670.0" y="566.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Two links, on purpose:</text><text x="670.0" y="583.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">a big diagnostic capture</text><text x="670.0" y="600.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">cannot stall the status loop.</text><line x1="34.0" y1="90.0" x2="1306.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Two brains, one board, one power supply</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The split is not cosmetic. Each side does the job the other physically cannot.</text><line x1="34.0" y1="619.0" x2="1306.0" y2="619.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="643.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Take the Linux half away and commissioning becomes a cloud round trip. Take the real-time half away and the spectra are no longer worth training on. This project needs both, on one board.</text><text x="34.0" y="664.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Both links run between the two chips inside the UNO Q. Neither leaves the board, and neither needs a wire a builder has to solder.</text></svg>