t-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">What can stop a machine</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Two inputs start a trip, and one operator control holds or clears it.</text><line x1="34.0" y1="829.0" x2="866.0" y2="829.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="853.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The classifier has no path in. It writes registry.last_classification, which is displayed and never</text><text x="34.0" y="874.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">read back into a trip decision.</text><text x="34.0" y="895.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">protection/protection.py contains zero references to the classifier.</text></svg>