<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="706" viewBox="0 0 1180 706"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1180" height="706" fill="#FFFFFF"/><rect x="34.0" y="158.0" width="268.0" height="128.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="168.0" y="208.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">KX134-1211</text><text x="168.0" y="227.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">same part as the base station —</text><text x="168.0" y="243.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one line item to buy in bulk</text><rect x="34.0" y="320.0" width="268.0" height="104.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="168.0" y="366.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">INMP441</text><text x="168.0" y="385.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">same part as the base station</text><rect x="34.0" y="458.0" width="268.0" height="100.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="168.0" y="494.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">WS2812B ring</text><text x="168.0" y="513.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">8 pixels — this node's only</text><text x="168.0" y="529.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">display, no LED matrix here</text><rect x="430.0" y="158.0" width="320.0" height="400.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="590.0" y="296.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Seeed XIAO ESP32-S3</text><text x="590.0" y="317.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="590.0" y="333.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">dual-core, 240 MHz</text><text x="590.0" y="349.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Wi-Fi 2.4 GHz + BLE</text><text x="590.0" y="365.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">8 MB PSRAM, 8 MB flash</text><text x="590.0" y="381.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="590.0" y="397.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">samples, FFTs and pools</text><text x="590.0" y="413.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the spectrum locally, then</text><text x="590.0" y="429.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">publishes one frame</text><path d="M302.0,222.0 L430.0,222.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="307.8" y="198.0" width="116.5" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="366.0" y="211.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">SPI + data-ready INT</text><path d="M302.0,372.0 L430.0,372.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="352.1" y="348.0" width="27.8" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="366.0" y="361.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">I²S</text><path d="M430.0,508.0 L302.0,508.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="343.4" y="484.0" width="45.1" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="366.0" y="497.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">1-wire</text><rect x="846.0" y="208.0" width="300.0" height="122.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="996.0" y="255.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Base station</text><text x="996.0" y="274.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">MQTT broker</text><text x="996.0" y="290.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">epm-base.local : 1883</text><rect x="846.0" y="392.0" width="300.0" height="118.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="996.0" y="437.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">On-board NVS</text><text x="996.0" y="456.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">SSID · password · broker,</text><text x="996.0" y="472.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">written once at setup</text><path d="M750.0,269.0 L846.0,269.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="779.2" y="245.0" width="37.5" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="798.0" y="258.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">MQTT</text><path d="M750.0,451.0 L846.0,451.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrowSoft)" marker-end="url(#arrowSoft)"/><line x1="34.0" y1="90.0" x2="1146.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Satellite node — the sensing half of the base station, on Wi-Fi</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Same two sensors, same status ring, same frame on the wire. Only the transport differs.</text><line x1="34.0" y1="625.0" x2="1146.0" y2="625.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="649.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The XIAO ESP32-S3 breaks out 11 GPIOs. The pin map keeps the board's fixed hardware SPI lines free for the accelerometer; exact pins are in the KiCad schematic in Appendix B.</text><text x="34.0" y="670.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">No per-unit configuration: the node's ID comes from its own Wi-Fi MAC, and its credentials come from the setup portal, not from a rebuild.</text></svg>