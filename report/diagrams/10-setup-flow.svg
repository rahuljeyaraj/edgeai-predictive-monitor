s is what</text><text x="135.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">recordings group by.</text><rect x="208.0" y="173.0" width="20.0" height="17" rx="8.5" fill="#5B6B7A" opacity="0.92"/><text x="218.0" y="185.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">1</text><rect x="40.0" y="350.0" width="95.4" height="21" rx="10.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.2"/><text x="87.7" y="364.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Machine: either</text><path d="M236.0,252.0 L250.0,252.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250.0" y="166.0" width="202.0" height="172.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="351.0" y="224.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Off</text><text x="351.0" y="243.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Measure what this sensor</text><text x="351.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">reads with the machine</text><text x="351.0" y="272.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">switched off — its own</text><text x="351.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">noise floor.</text><rect x="424.0" y="173.0" width="20.0" height="17" rx="8.5" fill="#3D5266" opacity="0.92"/><text x="434.0" y="185.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">2</text><rect x="256.0" y="350.0" width="83.4" height="21" rx="10.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.2"/><text x="297.7" y="364.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Machine: OFF</text><path d="M452.0,252.0 L466.0,252.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="466.0" y="166.0" width="202.0" height="172.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="567.0" y="224.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Running conditions</text><text x="567.0" y="243.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">One or more named ways</text><text x="567.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">this machine normally</text><text x="567.0" y="272.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">runs: no load, full load.</text><text x="567.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">≥50 frames each.</text><rect x="640.0" y="173.0" width="20.0" height="17" rx="8.5" fill="#3D5266" opacity="0.92"/><text x="650.0" y="185.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">3</text><rect x="472.0" y="350.0" width="77.4" height="21" rx="10.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.2"/><text x="510.7" y="364.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Machine: ON</text><path d="M668.0,252.0 L682.0,252.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="682.0" y="166.0" width="202.0" height="172.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="783.0" y="224.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Train</text><text x="783.0" y="243.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Fit this asset's own</text><text x="783.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">autoencoder and its</text><text x="783.0" y="272.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">own thresholds, here</text><text x="783.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">on the UNO Q.</text><rect x="856.0" y="173.0" width="20.0" height="17" rx="8.5" fill="#1B5FA8" opacity="0.92"/><text x="866.0" y="185.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">4</text><rect x="688.0" y="350.0" width="95.4" height="21" rx="10.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.2"/><text x="735.7" y="364.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Machine: either</text><path d="M884.0,252.0 L898.0,252.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="898.0" y="166.0" width="202.0" height="172.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="999.0" y="224.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">Trip output</text><text x="999.0" y="243.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Don't ask which motor —</text><text x="999.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">send a real stop and</text><text x="999.0" y="272.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">watch the machine go</text><text x="999.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">quiet. Skippable.</text><rect x="1072.0" y="173.0" width="20.0" height="17" rx="8.5" fill="#B03225" opacity="0.92"/><text x="1082.0" y="185.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">5</text><rect x="904.0" y="350.0" width="131.4" height="21" rx="10.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.2"/><text x="969.7" y="364.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Machine: ON → stopped</text><path d="M1100.0,252.0 L1114.0,252.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1114.0" y="166.0" width="202.0" height="172.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="1215.0" y="224.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">Done</text><text x="1215.0" y="243.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Summary, and the asset</text><text x="1215.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">goes live: scored on</text><text x="1215.0" y="272.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">every frame from here</text><text x="1215.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">on.</text><rect x="1288.0" y="173.0" width="20.0" height="17" rx="8.5" fill="#237A41" opacity="0.92"/><text x="1298.0" y="185.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">6</text><rect x="1120.0" y="350.0" width="95.4" height="21" rx="10.5" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.2"/><text x="1167.7" y="364.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">Machine: either</text><rect x="34.0" y="412.0" width="630.0" height="84.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="349.0" y="440.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">What it produces</text><text x="349.0" y="458.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">stopped_spectrum_ref · running_energy_ref · a trained model ·</text><text x="349.0" y="474.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">warning + fault thresholds · a confirmed trip output</text><rect x="690.0" y="412.0" width="616.0" height="84.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="998.0" y="440.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">What it replaced</text><text x="998.0" y="458.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">a Commission button on the tile · a baseline control buried in an expanded panel ·</text><text x="998.0" y="474.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">a motor dropdown hardcoded to three · a Record drawer nobody connected to any of it</text><text x="34.0" y="384.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start" fill="#4A5A6A">Only step 5 can be skipped — most monitored points have no actuator wired to them at all.</text><line x1="34.0" y1="90.0" x2="1306.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Commissioning a machine — one guided flow, six steps</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Before this there were four separate controls in four places, and nothing said what order they went in.</text><line x1="34.0" y1="559.0" x2="1306.0" y2="559.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="583.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Step 2 is the only instruction in the whole system a computer cannot check for you, which is why the wording says so out loud: a baseline measured while the machine runs teaches it that its own vibration is silence.</text><text x="34.0" y="604.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">Trip output sits after Train because its test needs a model to be able to answer “is it running?” at all. It used to be step 2, where its test could only ever fail.</text></svg>