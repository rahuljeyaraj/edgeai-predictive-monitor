amily="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Satellite nodes</text><text x="163.0" y="343.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">same two sensors, one per</text><text x="163.0" y="363.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">extra machine, an ESP32-S3</text><text x="163.0" y="382.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">each, joined over Wi-Fi</text><rect x="400.0" y="176.0" width="300.0" height="216.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="550.0" y="220.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22.10" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Base station</text><text x="550.0" y="242.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Arduino UNO Q</text><text x="550.0" y="262.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="550.0" y="281.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">asset registry</text><text x="550.0" y="301.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">per-machine anomaly model</text><text x="550.0" y="320.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-