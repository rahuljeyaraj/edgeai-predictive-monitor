rdware FIFO</text><rect x="34.0" y="296.0" width="268.0" height="112.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="168.0" y="336.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">INMP441</text><text x="168.0" y="357.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">I²S MEMS microphone</text><text x="168.0" y="376.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">24-bit, 61 dBA SNR</text><rect x="34.0" y="426.0" width="268.0" height="100.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="168.0" y="460.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">WS2812B ring</text><text x="168.0" y="481.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">8 addressable pixels</text><text x="168.0" y="500.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">local status light</text><rect x="414.0" y="128.0" width="352.0" height="498.0" rx="13" fill="#DCEAFB" fill-opacity="0.30" stroke="#1B5FA8" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="429.0" y="117.0" width="361.3" height="22" rx="6" fill="#FFFFFF" stroke="#1B5FA8" stroke-width="1.2"/><text x="609.7" y="132.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Arduino UNO Q — one board, two brains</text><rect x="444.0" y="162.0" width="292.0" height="250.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="590.0" y="232.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">STM32U585</text><text x="590.0" y="254.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Zephyr RTOS</text><text x="590.0" y="274.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="590.0" y="293.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">samples both sensors,</text><text x="590.0" y="312.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">runs the FFTs,</text><text x="590.0" y="332.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">computes scalar stats,</text><text x="590.0" y="351.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">drives both displays</text><rect x="444.0" y="462.0" width="292.0" height="142.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="590.0" y="508.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">QRB2210</text><text x="590.0" y="529.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Debian Linux, quad-core</text><text x="590.0" y="549.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A"></text><text x="590.0" y="568.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">models, registry, dashboard</text><path d="M302.0,214.0 L444.0,214.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="295.2" y="186.7" width="155.6" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="373.0" y="203.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">SPI1 + data-ready INT</text><path d="M302.0,352.0 L444.0,352.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="333.8" y="324.7" width="78.5" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="373.0" y="341.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">SAI1 · I²S</text><path d="M444.0,392.0 L373.0,392.0 L373.0,476.0 L302.0,476.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="321.8" y="448.7" width="87.4" height="23.3" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="365.5" y="465.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">timer + DMA</text><path d="M534.0,412.0 L534.0,462.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="406.7" y="