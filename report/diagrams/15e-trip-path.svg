amily="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Motor stopped or started</text><text x="660.0" y="219.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">manager.py:233 reports it</text><text x="660.0" y="240.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">on_motor_state  main.py:512</text><rect x="200.0" y="390.0" width="500.0" height="160.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="450.0" y="453.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.40" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">protection/protection.py</text><text x="450.0" y="476.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the trip decision</text><text x="450.0" y="497.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.90" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">countdown, confirm, trip</text><path d="M250.0,280.0 L250.0,390.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M660.0,280.0 L660.0,390.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="470.0" y="660.0" width="380.0" height="120.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="660.0" y="702.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20.80" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">frontend/app.js</text>