<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="472" viewBox="0 0 1320 472"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1320" height="472" fill="#FFFFFF"/><rect x="34.0" y="146.0" width="228.0" height="148.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="148.0" y="196.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Power it up</text><text x="148.0" y="216.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">No saved network, so it</text><text x="148.0" y="234.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">raises its own hotspot:</text><text x="148.0" y="253.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">EPM-SAT-a4cf12</text><rect x="232.2" y="153.0" width="21.8" height="22.1" rx="11.1" fill="#3D5266" opacity="0.92"/><text x="243.1" y="167.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.00" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">1</text><path d="M262.0,220.0 L288.0,220.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="288.0" y="146.0" width="228.0" height="148.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="402.0" y="196.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Join from a phone</text><text x="402.0" y="216.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Any phone. The setup page</text><text x="402.0" y="234.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">opens on its own — the</text><text x="402.0" y="253.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">captive-portal trick</text><rect x="486.2" y="153.0" width="21.8" height="22.1" rx="11.1" fill="#3D5266" opacity="0.92"/><text x="497.1" y="167.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.00" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">2</text><path d="M516.0,220.0 L542.0,220.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="542.0" y="146.0" width="228.0" height="148.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="656.0" y="196.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Fill three fields</text><text x="656.0" y="216.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Shop Wi-Fi name, password,</text><text x="656.0" y="234.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">broker address (already</text><text x="656.0" y="253.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">pre-filled)</text><rect x="740.2" y="153.0" width="21.8" height="22.1" rx="11.1" fill="#1B5FA8" opacity="0.92"/><text x="751.1" y="167.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.00" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">3</text><path d="M770.0,220.0 L796.0,220.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="796.0" y="146.0" width="228.0" height="148.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="910.0" y="196.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">It tests, then switches</text><text x="910.0" y="216.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Credentials are tried before</text><text x="910.0" y="234.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">they're saved, so a typo</text><text x="910.0" y="253.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">can't strand the node</text><rect x="994.2" y="153.0" width="21.8" height="22.1" rx="11.1" fill="#1B5FA8" opacity="0.92"/><text x="1005.1" y="167.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.00" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">4</text><path d="M1024.0,220.0 L1050.0,220.0" fill="none" stroke="#3D5266" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1050.0" y="146.0" width="228.0" height="148.0" rx="9" fill="#E4F3E8" stroke="#237A41" stroke-width="1.5" filter="url(#softshadow)"/><text x="1164.0" y="196.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18.20" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1A5C31">It appears</text><text x="1164.0" y="216.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">A new asset shows up on</text><text x="1164.0" y="234.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the Fleet page, waiting</text><text x="1164.0" y="253.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">to be commissioned</text><rect x="1248.2" y="153.0" width="21.8" height="22.1" rx="11.1" fill="#237A41" opacity="0.92"/><text x="1259.1" y="167.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.00" font-weight="bold" font-style="normal" text-anchor="middle" fill="#FFFFFF">5</text><text x="34.0" y="326.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.60" font-weight="normal" font-style="italic" text-anchor="start" fill="#4A5A6A">Elapsed: about a minute. Nothing was rebuilt, reflashed or edited.</text><line x1="34.0" y1="90.0" x2="1286.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Onboarding a node — no laptop, no rebuild, no config file</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The same five steps for the first node and for the fortieth.</text><line x1="34.0" y1="349.0" x2="1286.0" y2="349.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="373.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The base station onboards itself exactly the same way: with no network saved, it raises its own EPM-BaseStation hotspot and hijacks DNS so the</text><text x="34.0" y="394.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">phone's browser opens the Network tab by itself.</text><text x="34.0" y="415.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Nothing here is typed twice. The node's identity comes from its own Wi-Fi MAC, and the asset appears on the dashboard the moment its first frame</text><text x="34.0" y="436.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">lands.</text></svg>