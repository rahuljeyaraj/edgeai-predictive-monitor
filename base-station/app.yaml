# app.yaml: The main configuration file for your Arduino App.
# This file describes the application's metadata and properties.

# The user-visible name of the application.
name: edgeai-predictive-monitor-base-station

# The icon for the application, can be an emoji or a short string.
icon: 📳

# A list of network ports that the application exposes.
# Example: [80, 443]
ports: [8080, 8081]

# A list of bricks used by this application.
# arduino:telegram_bot powers the Telegram alerts feature
# (docs/DASHBOARD_IDEAS_BACKLOG.md). Also set TELEGRAM_BOT_TOKEN via App
# Lab's UI (brick-managed secret) -- the bot's @username for the dashboard's
# "Connect Telegram" deep link is resolved automatically at startup via
# Telegram's own getMe API (main.py), no second env var needed. Telegram
# alerts code paths no-op safely if TELEGRAM_BOT_TOKEN is left unset
# (main.py only wires the bot then).
# Temporarily disabled: this device's Telegram_bot_token brick variable isn't
# set, which fails the on-device build (not a main.py issue). Re-add
# arduino:telegram_bot once the token is configured again via App Lab.
bricks: []
