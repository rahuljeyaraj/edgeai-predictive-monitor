96.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="794.0" y="191.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">ingestion/mqtt_subscriber</text><text x="794.0" y="211.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">every satellite node</text><rect x="976.7" y="150.0" width="329.3" height="96.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="1141.3" y="191.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">common/telemetry_frame</text><text x="1141.3" y="211.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one generated codec</text><path d="M147.0,246.0 L147.0,272.0" fill="none" stroke="#3D5266" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="34.0" y="272.0" width="226.0" height="96.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="147.0" y="326.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Ingest &amp; route</text><rect x="282.0" y="272.0" width="329.3" height="96.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="446.7" y="313.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">pipeline/manager</text><text x="446.7" y="333.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">frame → asset, shape-checked</text><rect x="629.3" y="272.0" width="329.3" height="96.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="794.0" y="313.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">pipeline/features</text><text x="794.0" y="333.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">536-number feature vector</text><rect x="976.7" y="272.0" width="329.3" height="96.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="1141.3" y="313.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">common/wire_protocol</text><text x="1141.3" y="333.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">framing, CRC, sync</text><path d="M147.0,368.0 L147.0,394.0" fill="none" stroke="#3D5266" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="34.0" y="394.0" width="226.0" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="147.0" y="448.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Decide</text><rect x="282.0" y="394.0" width="329.3" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="446.7" y="435.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">pipeline/gate</text><text x="446.7" y="455.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">running or stopped?</text><rect x="629.3" y="394.0" width="329.3" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="794.0" y="435.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">pipeline/autoencoder + inference</text><text x="794.0" y="455.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">per-machine anomaly score</text><rect x="976.7" y="394.0" width="329.3" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1141.3" y="435.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">pipeline/classifier</text><text x="1141.3" y="455.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">which fault (TFLite)</text><path d="M147.0,490.0 L147.0,516.0" fill="none" stroke="#3D5266" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="34.0" y="516.0" width="226.0" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="147.0" y="570.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Remember</text><rect x="282.0" y="516.0" width="329.3" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="446.7" y="557.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">registry/registry</text><text x="446.7" y="577.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one live record per asset</text><rect x="629.3" y="516.0" width="329.3" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="794.0" y="557.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">history/store</text><text x="794.0" y="577.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">durable score history</text><rect x="976.7" y="516.0" width="329.3" height="96.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="1141.3" y="557.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">pipeline/capture</text><text x="1141.3" y="577.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">labelled recordings</text><path d="M147.0,612.0 L147.0,638.0" fill="none" stroke="#3D5266" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="34.0" y="638.0" width="226.0" height="96.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="147.0" y="692.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">Act &amp; tell</text><rect x="282.0" y="638.0" width="329.3" height="96.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="446.7" y="679.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">protection/protection</text><text x="446.7" y="699.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the trip — the only physical act</text><rect x="629.3" y="638.0" width="329.3" height="96.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="794.0" y="679.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">api/app + frontend/</text><text x="794.0" y="699.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">dashboard over WebSocket</text><rect x="976.7" y="638.0" width="329.3" height="96.0" rx="9" fill="#FBE1DE" stroke="#B03225" stroke-width="1.5" filter="url(#softshadow)"/><text x="1141.3" y="679.6" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8C271D">alerts/telegram_alerts</text><text x="1141.3" y="699.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.65" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">the phone</text><text x="34.0" y="764.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="italic" text-anchor="start" fill="#4A5A6A">Status pushes travel back down the same spine: a status change in the registry reaches the dashboard, the lights and the phone in one fan-out.</text><rect x="34.0" y="786.0" width="1272.0" height="78.0" rx="9" fill="#FBFCFD" stroke="#AAB6C2" stroke-width="1.5" filter="url(#softshadow)"/><text x="670.0" y="809.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.55" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7887">The one rule that keeps this honest</text><text x="670.0" y="829.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Nothing writes an asset's status directly. Every status change goes through one explicit state machine in the registry,</text><text x="670.0" y="848.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.30" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">which is what closed a real bug where pausing a node mid-commissioning silently stole it out from under the session.</text><line x1="34.0" y1="90.0" x2="1306.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Software architecture — what the Linux half is actually made of</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Five layers. Data flows up the left, decisions fan out to the right, and nothing skips a layer.</text><line x1="34.0" y1="879.0" x2="1306.0" y2="879.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="903.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The registry is the only thing that fans out. Every other module talks to it, not to each other — so adding a new output means subscribing to the</text><text x="34.0" y="924.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">registry, not editing the pipeline.</text><text x="34.0" y="945.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Every module named here has a matching test module in base-station/tests/ — 34 of them.</text></svg>