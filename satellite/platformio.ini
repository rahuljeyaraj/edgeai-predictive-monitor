[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
; Tell PlatformIO / esptool to use 8MB — matches the physical chip and
; prevents the esptool stub from doing a conservative 2MB address-range check.
board_build.flash_size = 8MB
; Without this, PlatformIO's size-report percentage falls back to a board-
; manifest default (1MB) instead of reading the actual custom IDF partition
; table CSV (already active via sdkconfig.defaults' CONFIG_PARTITION_TABLE_
; CUSTOM_FILENAME) — the factory app partition here is really 0x6F0000.
board_build.partitions = partitions_simple_8mb.csv
framework = espidf

; Baud rate must match CONFIG_ESP_CONSOLE_UART_BAUDRATE in sdkconfig.defaults (115200).
; XIAO ESP32-S3 routes the console through USB JTAG/CDC (baud-rate independent),
; so this value only matters when using a UART-to-USB bridge.
monitor_speed = 115200

; esp32_exception_decoder: symbolises crash addresses to source file + line.
; direct: no newline stripping, preserves raw ESP-IDF log format.
monitor_filters = esp32_exception_decoder, direct

; HW-01 FIX: Use built-in USB JTAG (MI_02, WinUSB/oem99.inf) for upload instead
; of esptool via the CDC port. Opening the CDC port (usbser.sys) sends CDC
; SET_LINE_CODING which triggers USB_UART_CHIP_RESET → download mode on
; ESP32-S3. JTAG upload never touches the CDC port, so WiFi keeps running
; after flash.
upload_protocol = esp-builtin
upload_speed = 921600
; DTR=0 / RTS=0 prevents CDC SET_LINE_CODING from triggering USB_UART_CHIP_RESET
; into download mode — safe to open the CDC port with these lines suppressed.
;
; monitor_port matches by VID:PID (303A:1001 = XIAO ESP32-S3 built-in USB
; JTAG/CDC) instead of a hardcoded COM number — the assigned COM number
; shifts across replugs/ports/reboots on Windows (was COM7, now COM15 on
; this machine), so a fixed value goes stale silently.
monitor_port = hwgrep://303A:1001
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DFFT_MIC_N=1024
    -DFFT_IMU_N=2048
    -DSPEC_AVG_N=8
    ; Workaround for GCC 14.2.0 ICE in IRA pass on Windows (esp_lcd_panel_rgb.c).
    ; Disables loop-pressure analysis in the register allocator — no effect on
    ; our DSP code (which uses SIMD intrinsics, not auto-vectorisation via IRA).
    -fno-ira-loop-pressure
