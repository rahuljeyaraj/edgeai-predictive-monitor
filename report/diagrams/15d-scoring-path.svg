eight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">classified, and then returns at step 3.</text><text x="34.0" y="1065.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">The two gates are separate instances. Neither one gates the other.</text></svg>