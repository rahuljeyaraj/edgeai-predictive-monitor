Vu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Wi-Fi</text><text x="1005.0" y="528.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">dashboard on :8080</text><text x="1005.0" y="548.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">MQTT broker for satellites</text><text x="1005.0" y="567.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">epm-base.local</text><path d="M736.0,224.0 L864.0,224.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M736.0,342.0 L864.0,342.0" fill="none" stroke="#8C9AA8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#arrowSoft)"/><path d="M736.0,533.0 L864.0,533.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="34.0" y1="90.0" x2="1146.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Base station — what connects where</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">All three peripherals hang off the real-time half of the board. The Linux half never touches a sensor pin.</text><line x1="34.0" y1="683.0" x2="1146.0" y2="683.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="707.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Two internal links, on purpose: small control messages on the UART, bulk spectra on the SPI, so a large diagnostic pull can never</text><text x="34.0" y="728.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">stall the live status loop.</text><text x="34.0" y="749.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Exact nets, net names and header pins: the KiCad schematic.</text></svg>