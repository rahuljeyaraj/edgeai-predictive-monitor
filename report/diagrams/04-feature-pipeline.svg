ily="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">Feature vector</text><text x="283.0" y="205.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">FFT spectrum + 6 shape stats per channel  =  536 numbers</text><rect x="34.0" y="262.0" width="498.0" height="84.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="283.0" y="288.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Autoencoder</text><text x="283.0" y="309.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">squeeze it small, rebuild it, measure the error</text><text x="283.0" y="328.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">trained on this machine's healthy data, on the UNO Q</text><rect x="34.0" y="376.0" width="498.0" height="84.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="283.0" y="412.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19.50" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">Anomaly score</text><text x="283.0" y="433.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">one number: how unlike normal this moment is</text><path d="M283.0,118.0 L283.0,148.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M283.0,232.0 L283.0,262.0" fill="none" stroke="#3D5266" stroke-width="1.7