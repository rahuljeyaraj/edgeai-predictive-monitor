ect x="133.9" y="100.0" width="15" height="14" rx="3.5" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.3"/><text x="155.9" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Decides</text><rect x="238.9" y="100.0" width="15" height="14" rx="3.5" fill="#E4F3E8" stroke="#237A41" stroke-width="1.3"/><text x="260.9" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Tells a human</text><rect x="386.0" y="100.0" width="15" height="14" rx="3.5" fill="#FBE1DE" stroke="#B03225" stroke-width="1.3"/><text x="408.0" y="111.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.95" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Acts (physical)</text><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24.70" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">Full system architecture</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Three kinds of board. Only one of them decides anything.</text><line x1="34.0" y1="659.0" x2="1286.0" y2="659.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="683.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Every sensing path — internal SPI or Wi-Fi — delivers the identical frame, so the scoring pipeline never learns which kind of node a machine is</text><text x="34.0" y="704.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">behind.</text><text x="34.0" y="725.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.25" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">The motor-driver rig is an actuator, not a peer: it accepts stop, and nothing else.</text></svg>