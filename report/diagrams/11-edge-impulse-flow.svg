<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="764" viewBox="0 0 1340 764"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#3D5266"/></marker><marker id="arrowAct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#B03225"/></marker><marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#8C9AA8"/></marker><marker id="arrowTell" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#237A41"/></marker><filter id="softshadow" x="-12%" y="-12%" width="130%" height="140%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#16202B" flood-opacity="0.13"/></filter></defs><rect x="0" y="0" width="1340" height="764" fill="#FFFFFF"/><rect x="34.0" y="150.0" width="604.0" height="372.0" rx="13" fill="#DCEAFB" fill-opacity="0.30" stroke="#1B5FA8" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="49.0" y="139.0" width="110.5" height="22" rx="6" fill="#FFFFFF" stroke="#1B5FA8" stroke-width="1.2"/><text x="104.2" y="154.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">On the UNO Q</text><rect x="58.0" y="194.0" width="264.0" height="108.0" rx="9" fill="#EDF2F7" stroke="#3D5266" stroke-width="1.5" filter="url(#softshadow)"/><text x="190.0" y="227.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A3B4C">1 · Record</text><text x="190.0" y="246.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Open an asset's Record drawer,</text><text x="190.0" y="261.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">type a label, press Start.</text><text x="190.0" y="276.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Runs server-side — close the tab.</text><rect x="350.0" y="194.0" width="264.0" height="108.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="482.0" y="227.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">2 · Select &amp; Upload</text><text x="482.0" y="246.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">Tick recordings on that class's</text><text x="482.0" y="261.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">card. Standardised, named,</text><text x="482.0" y="276.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">batched 25 × 8 in flight.</text><rect x="58.0" y="350.0" width="264.0" height="108.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="190.0" y="383.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">5 · Classify live</text><text x="190.0" y="402.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">TFLite on the CPU, on the same</text><text x="190.0" y="417.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">feature vector the anomaly</text><text x="190.0" y="432.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">model already sees.</text><rect x="350.0" y="350.0" width="264.0" height="108.0" rx="9" fill="#DCEAFB" stroke="#1B5FA8" stroke-width="1.5" filter="url(#softshadow)"/><text x="482.0" y="383.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#154A85">4 · Fetch</text><text x="482.0" y="402.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">One button pulls the built</text><text x="482.0" y="417.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">.tflite back down and applies it</text><text x="482.0" y="432.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">to every asset of that class.</text><path d="M322.0,248.0 L350.0,248.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M350.0,404.0 L322.0,404.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="706.0" y="150.0" width="600.0" height="372.0" rx="13" fill="#F4F6F8" fill-opacity="0.30" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="8,5"/><rect x="721.0" y="139.0" width="115.0" height="22" rx="6" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="1.2"/><text x="778.5" y="154.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Edge Impulse</text><rect x="730.0" y="194.0" width="552.0" height="108.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1006.0" y="235.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">Project — one per asset class</text><text x="1006.0" y="253.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">created from the dashboard: project + impulse + training config,</text><text x="1006.0" y="268.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">features input block with real column names (accel_x_bin0, rms_x, …)</text><rect x="730.0" y="350.0" width="552.0" height="108.0" rx="9" fill="#F4F6F8" stroke="#5B6B7A" stroke-width="1.5" filter="url(#softshadow)"/><text x="1006.0" y="391.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3D4B58">3 · Train in Studio</text><text x="1006.0" y="409.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">The one step deliberately left in Edge Impulse's own hands.</text><text x="1006.0" y="424.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">DSP tuning and model architecture are what Studio is good at.</text><path d="M614.0,248.0 L730.0,248.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="632.5" y="224.0" width="78.9" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="672.0" y="237.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">ingestion API</text><path d="M1006.0,302.0 L1006.0,350.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M730.0,404.0 L672.0,404.0 L672.0,404.0 L614.0,404.0" fill="none" stroke="#3D5266" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="651.8" y="380.0" width="98.5" height="20.0" rx="4" fill="#FFFFFF" opacity="0.94"/><text x="701.0" y="393.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#16202B">build + download</text><rect x="34.0" y="556.0" width="1272.0" height="92.0" rx="9" fill="#FDF0D6" stroke="#A97105" stroke-width="1.5" filter="url(#softshadow)"/><text x="670.0" y="580.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#845804">The part that is easy to get wrong</text><text x="670.0" y="599.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">The scalar tail is standardised against a baseline pooled across every recording of that asset class — fitted on the</text><text x="670.0" y="615.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">train split only, and saved to disk — so the data the model is trained on and the data it is served at runtime are on the</text><text x="670.0" y="630.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#4A5A6A">same scale. Fit it per node instead and five identical lathes quietly pull the model five different ways.</text><text x="34.0" y="538.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start" fill="#4A5A6A">Train once, cover every machine of that type. The anomaly model is per machine; this one is not.</text><line x1="34.0" y1="90.0" x2="1306.0" y2="90.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#16202B">The Edge Impulse round trip</text><text x="34.0" y="76.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Record on the machine · upload from the dashboard · train in Studio · fetch the model back. One project per asset class.</text><line x1="34.0" y1="683.0" x2="1306.0" y2="683.0" stroke="#D6DEE6" stroke-width="1"/><text x="34.0" y="707.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#4A5A6A">Everything on the device side is plain REST from the standard library — no Edge Impulse SDK is installed on the board, so nothing here can be broken by a dependency the UNO Q can't build.</text><text x="34.0" y="728.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#B03225">The classifier names the fault. It is never allowed to stop a motor — that path reads the anomaly gate alone and has no code path that can see a classification.</text></svg>